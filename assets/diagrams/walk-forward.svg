<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 360" width="1100" height="360" role="img" aria-label="Walk-forward folds: each fold trains on the past, leaves an embargo gap, validates, leaves a second gap, then tests on the next window. The four test windows sit side by side and join into one out-of-sample record.">
  <title>Walk-forward folds stitched into one out-of-sample record</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#1f2328"/>
    </marker>
  </defs>
  <g font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
    <rect x="8" y="8" width="1084" height="344" rx="16" fill="#f6f8fa" stroke="#d0d7de"/>

    <rect x="210" y="30" width="18" height="12" fill="#c3cad3"/>
    <text x="234" y="41" font-size="12" fill="#1f2328">train, from the first bar</text>
    <rect x="470" y="30" width="18" height="12" fill="#9ec5ec"/>
    <text x="494" y="41" font-size="12" fill="#1f2328">validation picks the checkpoint</text>
    <rect x="740" y="30" width="18" height="12" fill="#1f6feb"/>
    <text x="764" y="41" font-size="12" fill="#1f2328">test, one look</text>
    <rect x="890" y="30" width="18" height="12" fill="none" stroke="#57606a" stroke-dasharray="3 2"/>
    <text x="914" y="41" font-size="12" fill="#1f2328">embargo gap</text>

    <g font-size="13" fill="#1f2328">
      <text x="36" y="88">Fold 1</text>
      <text x="36" y="138">Fold 2</text>
      <text x="36" y="188">Fold 3</text>
      <text x="36" y="238">Fold 4</text>
    </g>

    <!-- Fold 1: test starts at x 520 -->
    <rect x="210" y="70" width="198" height="28" fill="#c3cad3"/>
    <rect x="408" y="70" width="16" height="28" fill="none" stroke="#57606a" stroke-dasharray="3 2"/>
    <rect x="424" y="70" width="80" height="28" fill="#9ec5ec"/>
    <rect x="504" y="70" width="16" height="28" fill="none" stroke="#57606a" stroke-dasharray="3 2"/>
    <rect x="520" y="70" width="105" height="28" fill="#1f6feb"/>
    <g font-size="11" text-anchor="middle">
      <text x="309" y="88" fill="#1f2328">train</text>
      <text x="464" y="88" fill="#1f2328">validation</text>
      <text x="572.5" y="88" fill="#ffffff">test</text>
    </g>

    <!-- Fold 2: test starts at x 625 -->
    <rect x="210" y="120" width="303" height="28" fill="#c3cad3"/>
    <rect x="513" y="120" width="16" height="28" fill="none" stroke="#57606a" stroke-dasharray="3 2"/>
    <rect x="529" y="120" width="80" height="28" fill="#9ec5ec"/>
    <rect x="609" y="120" width="16" height="28" fill="none" stroke="#57606a" stroke-dasharray="3 2"/>
    <rect x="625" y="120" width="105" height="28" fill="#1f6feb"/>

    <!-- Fold 3: test starts at x 730 -->
    <rect x="210" y="170" width="408" height="28" fill="#c3cad3"/>
    <rect x="618" y="170" width="16" height="28" fill="none" stroke="#57606a" stroke-dasharray="3 2"/>
    <rect x="634" y="170" width="80" height="28" fill="#9ec5ec"/>
    <rect x="714" y="170" width="16" height="28" fill="none" stroke="#57606a" stroke-dasharray="3 2"/>
    <rect x="730" y="170" width="105" height="28" fill="#1f6feb"/>

    <!-- Fold 4: test starts at x 835 -->
    <rect x="210" y="220" width="513" height="28" fill="#c3cad3"/>
    <rect x="723" y="220" width="16" height="28" fill="none" stroke="#57606a" stroke-dasharray="3 2"/>
    <rect x="739" y="220" width="80" height="28" fill="#9ec5ec"/>
    <rect x="819" y="220" width="16" height="28" fill="none" stroke="#57606a" stroke-dasharray="3 2"/>
    <rect x="835" y="220" width="105" height="28" fill="#1f6feb"/>

    <g stroke="#1f2328" stroke-width="1.4" stroke-dasharray="4 3" fill="none">
      <line x1="572.5" y1="98" x2="572.5" y2="298" marker-end="url(#arrow)"/>
      <line x1="677.5" y1="148" x2="677.5" y2="298" marker-end="url(#arrow)"/>
      <line x1="782.5" y1="198" x2="782.5" y2="298" marker-end="url(#arrow)"/>
      <line x1="887.5" y1="248" x2="887.5" y2="298" marker-end="url(#arrow)"/>
    </g>

    <rect x="520" y="300" width="105" height="26" fill="#1f6feb" stroke="#ffffff" stroke-width="1.5"/>
    <rect x="625" y="300" width="105" height="26" fill="#1f6feb" stroke="#ffffff" stroke-width="1.5"/>
    <rect x="730" y="300" width="105" height="26" fill="#1f6feb" stroke="#ffffff" stroke-width="1.5"/>
    <rect x="835" y="300" width="105" height="26" fill="#1f6feb" stroke="#ffffff" stroke-width="1.5"/>
    <g font-size="11" fill="#ffffff" text-anchor="middle">
      <text x="572.5" y="317">test 1</text>
      <text x="677.5" y="317">test 2</text>
      <text x="782.5" y="317">test 3</text>
      <text x="887.5" y="317">test 4</text>
    </g>
    <g font-size="13" font-weight="700" fill="#1f2328">
      <text x="36" y="311">Out-of-sample</text>
      <text x="36" y="327">record</text>
    </g>

    <line x1="210" y1="342" x2="1060" y2="342" stroke="#57606a" stroke-width="1.4" marker-end="url(#arrow)"/>
    <text x="198" y="346" text-anchor="end" font-size="12" fill="#57606a">time</text>
  </g>
</svg>
