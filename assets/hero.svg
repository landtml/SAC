      <stop offset="0.43103" stop-color="#9AA5AE"/>
      <stop offset="0.43103" stop-color="#1E9E6A"/>
      <stop offset="1" stop-color="#1E9E6A"/>
    </linearGradient>
  </defs>
  <style>
    .pol { transform-box: view-box; transform-origin: 142px 188px; animation: policy 8s ease-in-out infinite; }
    .price { stroke-dasharray: 1; animation: trace 8s linear infinite; }
    .band { opacity: 0; animation: band 8s ease-in-out infinite; }
    .nolabel { opacity: 0; animation: nolabel 8s ease-in-out infinite; }

    @keyframes policy {
      0%, 15%, 29%, 100% { transform: translateX(0) scale(1, 1); }
      18%, 26% { transform: translateX(-38px) scale(1.15, 0.8); }
    }
    @keyframes trace {
      0% { stroke-dashoffset: 1; opacity: 0; }
      3% { opacity: 1; }
      62% { stroke-dashoffset: 0; opacity: 1; }
      88% { stroke-dashoffset: 0; opacity: 1; }
      98% { stroke-dashoffset: 0; opacity: 0; }
      100% { stroke-dashoffset: 1; opacity: 0; }
    }
    @keyframes band {
      0%, 2% { opacity: 0; }
      10%, 88% { opacity: 0.2; }
      98%, 100% { opacity: 0; }
    }
    @keyframes nolabel {
      0%, 15%, 29%, 100% { opacity: 0; }
      18%, 26% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      .pol, .price, .band, .nolabel { animation: none; }
      .band { opacity: 0.2; }
      .price { stroke-dasharray: none; }
    }
  </style>

