  <title id="t">SoftEdge: Soft Actor-Critic agents in search of a trading edge, measured honestly</title>
  <defs>
    <linearGradient id="line" gradientUnits="userSpaceOnUse" x1="60" y1="0" x2="1220" y2="0">
      <stop offset="0" stop-color="#1E9E6A"/>
      <stop offset="0.27586" stop-color="#1E9E6A"/>
