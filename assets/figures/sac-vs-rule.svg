<text x="24.0" y="56.0" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" text-anchor="start" fill="#52514e">Sharpe of SAC minus its best simple rule, out of sample, with 95% CI.</text>
<text x="24.0" y="74.0" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" text-anchor="start" fill="#52514e">Two of three carry markets clear zero. The Hyperliquid basis CI crosses it (p = 0.13).</text>
