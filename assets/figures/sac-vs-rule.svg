<svg xmlns="http://www.w3.org/2000/svg" width="760" height="610" viewBox="0 0 760 610" role="img" aria-labelledby="t d">
<title id="t">On real markets, SAC beats its simple rule only in funding-carry markets</title>
<desc id="d">Forest plot: SAC minus its best simple rule, Sharpe, with 95% intervals.</desc>
<rect x="0.5" y="0.5" width="759" height="609" rx="8" fill="#fcfcfb" stroke="#e1e0d9"/>
