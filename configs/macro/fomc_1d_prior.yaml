name: fomc_1d_prior
universe: macro_fomc
symbols: [SPX, NDX, NKY]
data: {end: 2026-09, resample: 1D, start: 2000-01}
# Costs: borrow_apr 0 and max_leverage 4 on the index legs, as in macro_1d_*.yaml. The tape
# charges borrow on spot shorts only and no financing on leveraged longs, and the spot legs ignore
# futures roll. Both legs are therefore free, and absolute and short-leg results are optimistic.
costs: {fee_bps: 1.0, half_spread_bps: 0.5, maint_margin: 0.05, max_leverage: 4.0, borrow_apr: 0.0}
walk_forward: {embargo: 5D, end: '2026-09-01', first_test: '2012-01-01', fold_steps: 15000, test: 730D,
  val: 365D, warm_start: true}
# Prior: fomc_next is 1 on a session with a scheduled FOMC announcement and 0 otherwise, so the gain
# of 1 (the default) puts the prior at full volatility-targeted long on those sessions only.
env: {cost_mult_high: 2.0, cost_mult_low: 0.5, episode_len: 256, n_envs: 16, window: 4, vol_target: 0.1,
  prior_feature: fomc_next}
sac: {actor_hidden: 32, critic_blocks: 1, gamma: 0.95, hidden: 64, risk: mean, smooth_coef: 0.5, target_entropy_scale: 0.5,
  action_l2: 0.05}
train: {eval_every: 500, relabel_frac: 0.5, target_entropy_end_scale: 2.0, threads: 1, total_steps: 40000,
  utd: 0.25, warmup_steps: 5000}
trend: {lookback: 120, target_vol: 0.1, vol_span: 60}
deploy: {gate_psr: 0.8}
seeds: [0, 1]
reference: buy_and_hold
