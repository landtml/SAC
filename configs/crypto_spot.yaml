name: crypto_spot
universe: crypto_spot
data: {start: "2020-01", end: "2026-09"}
costs: {fee_bps: 7.5, half_spread_bps: 1.0, max_leverage: 1.0, borrow_apr: 0.10}
split:
  train: [null, "2024-01-01"]
  val: ["2024-01-01", "2025-01-01"]
  test: ["2025-01-01", null]
