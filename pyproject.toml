[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "softedge"
version = "0.2.0"
description = "Soft Actor-Critic trading agents tested with honest out-of-sample statistics across crypto, forex, macro and prediction markets"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "landtml" }]
keywords = [
    "reinforcement-learning",
    "soft-actor-critic",
    "sac",
    "algorithmic-trading",
    "quantitative-finance",
    "crypto",
    "forex",
    "prediction-markets",
    "deflated-sharpe-ratio",
    "backtesting",
    "pytorch",
]
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "pyarrow>=14",
    "scipy>=1.11",
    "torch>=2.2",
    "pyyaml>=6",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-xdist>=3", "ruff>=0.5"]
jax = ["jax>=0.11", "flax>=0.12.10", "optax>=0.2.8", "chex>=0.1.92", "orbax-checkpoint>=0.12.7"]

[project.scripts]
softedge = "softedge.cli:main"

[project.urls]
Homepage = "https://github.com/landtml/SoftEdge"
Repository = "https://github.com/landtml/SoftEdge"
Issues = "https://github.com/landtml/SoftEdge/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["network: test downloads data from the internet (deselect with -m 'not network')"]
addopts = "-m 'not network'"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "NPY"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Kept byte for byte: its SHA-256 is fixed by docs/preregistration-parity-pooled.md.
"research/parity/blind_panels.py" = ["B905"]
